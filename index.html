      ];

      var video = document.getElementById("videoPlayer");

      var channelListEl = document.getElementById("channelList");
      var categoryTabs = document.getElementById("categoryTabs");
      var searchInput = document.getElementById("searchInput");
      var channelCount = document.getElementById("channelCount");
      var currentLogo = document.getElementById("currentLogo");
      var currentTitle = document.getElementById("currentTitle");
      var currentCategory = document.getElementById("currentCategory");
      var streamStatus = document.getElementById("streamStatus");

      var prevChBtn = document.getElementById("prevChBtn");
      var nextChBtn = document.getElementById("nextChBtn");
      var reloadStreamBtn = document.getElementById("reloadStreamBtn");
      var aspectBtn = document.getElementById("aspectBtn");
      var fullDisplayBtn = document.getElementById("fullDisplayBtn");

      var videoStage = document.getElementById("videoStage");
      var videoFrame = document.getElementById("videoFrame");

      /* Explicit pixel sizing for LG webOS Chromium 53 hardware video overlay */
      function syncInlineVideoBoxSize() {
        if (!videoFrame || !video) return;
        if (isFullDisplay) {
          var fullW = window.innerWidth || document.documentElement.clientWidth || 1280;
          var fullH = Math.max(200, (window.innerHeight || document.documentElement.clientHeight || 720) - 62);
          videoFrame.style.width = fullW + "px";
          videoFrame.style.height = fullH + "px";
          video.style.width = fullW + "px";
          video.style.height = fullH + "px";
          return;
        }
        if (videoStage) {
          var stageW = videoStage.clientWidth || 760;
          var stageH = videoStage.clientHeight || 420;
          var targetW = Math.min(Math.floor(stageW * 0.84), 680);
          var targetH = Math.min(Math.floor(stageH - 20), Math.floor(targetW * 9 / 16));
          if (targetH < 180) targetH = 180;
          targetW = Math.floor(targetH * 16 / 9);
          videoFrame.style.width = targetW + "px";
          videoFrame.style.height = targetH + "px";
          video.style.width = targetW + "px";
          video.style.height = targetH + "px";
        }
      }

      /* Force LG webOS hardware video plane punch-through repaint when metadata/playing fires */
      function nudgeHardwareVideoPlane() {
        syncInlineVideoBoxSize();
        try {
          video.style.visibility = "hidden";
          void video.offsetHeight;
          video.style.visibility = "visible";
        } catch (e) {}
      }

      window.addEventListener("resize", syncInlineVideoBoxSize);
      syncInlineVideoBoxSize();

      var channels = [];
      var filteredChannels = [];
      var renderedCount = 0;
      var activeCategory = "Bangladesh";
      var searchQuery = "";
      var activeChannelUrl = null;
      var activeChannelObj = null;
      var hls = null;

      var stallWatchdogTimer = null;
      var lastPlaybackTime = 0;
      var stallCount = 0;
      var isZoomFill = false;
      var isFullDisplay = false;
      var zapDigits = "";
      var zapTimer = null;

      // Default to 720p Cap (falls back to 480p if 720p is unavailable) so 1080p streams never choke the TV
      var STORAGE_DEFAULT_QUALITY = "iptv_default_quality_v1";
      var supportsNativeHls = !!(video && video.canPlayType && video.canPlayType("application/vnd.apple.mpegurl"));
      var preferredQualityMode = "cap-720";
      try {
        var savedPrefQ = localStorage.getItem(STORAGE_DEFAULT_QUALITY);
        if (savedPrefQ) preferredQualityMode = savedPrefQ;
      } catch (e) {}
      var currentEngineMode = (preferredQualityMode === "hw" && supportsNativeHls) ? "hw" : "mse";

      function hasClass(el, cls) {
        return (" " + el.className + " ").indexOf(" " + cls + " ") !== -1;
      }

      function addClass(el, cls) {
        if (!hasClass(el, cls)) {
          el.className = (el.className ? el.className + " " : "") + cls;
        }
      }

      function removeClass(el, cls) {
        el.className = (" " + el.className + " ").replace(" " + cls + " ", " ").replace(/^\s+|\s+$/g, "");
      }

      function setStatus(text, type) {
        streamStatus.textContent = text;
        streamStatus.className = "status-badge" + (type ? " " + type : "");
      }

      function pickBestLevelForCap(levels, maxHeight) {
        if (!levels || levels.length === 0) return -1;
        var bestIdx = -1;
        var bestHeight = -1;
        var lowestIdx = 0;
        var lowestHeight = levels[0].height || 99999;

        for (var i = 0; i < levels.length; i++) {
          var h = levels[i].height || 0;
          if (h > 0 && h < lowestHeight) {
            lowestHeight = h;
            lowestIdx = i;
          }
          if (h > 0 && h <= maxHeight && h > bestHeight) {
            bestHeight = h;
            bestIdx = i;
          }
        }
        return bestIdx !== -1 ? bestIdx : lowestIdx;
      }

      /* Dedicated Quality Selector Population & Handler */
      function populateQualityDropdown(levels, isHwMode) {
        qualitySelect.innerHTML = "";

        if (typeof Hls !== "undefined" && Hls.isSupported()) {
          var cap720Opt = document.createElement("option");
          cap720Opt.value = "cap-720";
          cap720Opt.textContent = "Default: 720p Cap";
          qualitySelect.appendChild(cap720Opt);

          var cap480Opt = document.createElement("option");
          cap480Opt.value = "cap-480";
          cap480Opt.textContent = "480p Cap (Smooth)";
          qualitySelect.appendChild(cap480Opt);

          var autoOpt = document.createElement("option");
          autoOpt.value = "mse-auto";
          autoOpt.textContent = levels && levels.length > 1 ? "ABR Auto (" + levels.length + "Q)" : "ABR Auto (All)";
          qualitySelect.appendChild(autoOpt);
        }

        if (supportsNativeHls) {
          var hwOpt = document.createElement("option");
          hwOpt.value = "hw";
          hwOpt.textContent = "HW Native (Uncapped)";
          qualitySelect.appendChild(hwOpt);
        }

        if (levels && levels.length > 0 && typeof Hls !== "undefined" && Hls.isSupported()) {
          var sorted = [];
          for (var i = 0; i < levels.length; i++) {
            sorted.push({ index: i, height: levels[i].height || 0, bitrate: levels[i].bitrate || 0 });
          }
          sorted.sort(function (a, b) {
            return (b.height - a.height) || (b.bitrate - a.bitrate);
          });

          for (var j = 0; j < sorted.length; j++) {
            var lvl = sorted[j];
            var opt = document.createElement("option");
            opt.value = "level-" + lvl.index;
            var kbps = lvl.bitrate ? " (" + Math.round(lvl.bitrate / 1000) + "k)" : "";
            opt.textContent = (lvl.height ? lvl.height + "p" : "Stream " + (lvl.index + 1)) + kbps;
            qualitySelect.appendChild(opt);
          }
        }

        if (isHwMode || preferredQualityMode === "hw") {
          qualitySelect.value = "hw";
        } else if (preferredQualityMode === "cap-720" || preferredQualityMode === "cap-480") {
          qualitySelect.value = preferredQualityMode;
        } else if (hls && hls.currentLevel >= 0 && !hls.autoLevelEnabled) {
          qualitySelect.value = "level-" + hls.currentLevel;
        } else {
          qualitySelect.value = "mse-auto";
        }
      }

      qualitySelect.addEventListener("change", function () {
        var val = qualitySelect.value;
        if (!activeChannelObj) return;

        if (val === "hw") {
          preferredQualityMode = "hw";
          try { localStorage.setItem(STORAGE_DEFAULT_QUALITY, "hw"); } catch (e) {}
          currentEngineMode = "hw";
          startHardwarePlayback(getPlayableUrl(activeChannelObj.url, false), activeChannelObj, false, 0);
          return;
        }

        if (val === "cap-720" || val === "cap-480") {
          preferredQualityMode = val;
          try { localStorage.setItem(STORAGE_DEFAULT_QUALITY, val); } catch (e) {}
          var maxH = val === "cap-480" ? 480 : 720;
          if (currentEngineMode !== "mse" || !hls) {
            currentEngineMode = "mse";
            startMseFallbackPlayback(getPlayableUrl(activeChannelObj.url, false), activeChannelObj, false, -1, maxH);
          } else {
            var targetIdx = pickBestLevelForCap(hls.levels, maxH);
            hls.autoLevelCapping = targetIdx;
            hls.currentLevel = targetIdx;
            var pickedH = (hls.levels && hls.levels[targetIdx] && hls.levels[targetIdx].height) ? hls.levels[targetIdx].height + "p" : maxH + "p";
            setStatus("Live (" + pickedH + " Cap)", "ok");
          }
          return;
        }

        if (val === "mse-auto") {
          preferredQualityMode = "mse-auto";
          try { localStorage.setItem(STORAGE_DEFAULT_QUALITY, "mse-auto"); } catch (e) {}
          if (currentEngineMode !== "mse" || !hls) {
            currentEngineMode = "mse";
            startMseFallbackPlayback(getPlayableUrl(activeChannelObj.url, false), activeChannelObj, false, -1, 0);
          } else {
            hls.autoLevelCapping = -1;
            hls.currentLevel = -1;
            setStatus("Live (ABR Auto)", "ok");
          }
          return;
        }

        if (val.indexOf("level-") === 0) {
          var targetLvl = parseInt(val.replace("level-", ""), 10);
          if (currentEngineMode !== "mse" || !hls) {
            currentEngineMode = "mse";
            startMseFallbackPlayback(getPlayableUrl(activeChannelObj.url, false), activeChannelObj, false, targetLvl, 0);
          } else {
            hls.autoLevelCapping = -1;
            hls.currentLevel = targetLvl;
            var h = (hls.levels && hls.levels[targetLvl] && hls.levels[targetLvl].height) ? hls.levels[targetLvl].height + "p" : "Locked";
            setStatus("Live (" + h + ")", "ok");
          }
        }
      });

      function parseM3U(m3uText) {
        var lines = m3uText.split(/\r?\n/);
        var parsed = [];
        var currentInfo = null;

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].replace(/^\s+|\s+$/g, "");
          if (!line) continue;

          if (line.indexOf("#EXTINF:") === 0) {
            var logoMatch = line.match(/tvg-logo="([^"]*)"/i);
            var groupMatch = line.match(/group-title="([^"]*)"/i);
            var commaIdx = line.lastIndexOf(",");
            var name = commaIdx !== -1 ? line.substring(commaIdx + 1).replace(/^\s+|\s+$/g, "") : "Channel";

            currentInfo = {
              name: name || "Channel",
              logo: (logoMatch && logoMatch[1]) ? logoMatch[1] : FALLBACK_LOGO,
              group: (groupMatch && groupMatch[1]) ? groupMatch[1] : "Others"
            };
          } else if (line.charAt(0) !== "#" && currentInfo) {
            parsed.push({
              num: parsed.length + 1,
              name: currentInfo.name,
              logo: currentInfo.logo,
              group: currentInfo.group,
              url: line
            });
            currentInfo = null;
          }
        }
        return parsed;
      }

      function buildCategoryTabs() {
        var rawGroups = [];
        for (var i = 0; i < channels.length; i++) {
          if (rawGroups.indexOf(channels[i].group) === -1) {
            rawGroups.push(channels[i].group);
          }
        }

        var priorityOrder = ["bangladesh", "india", "kids"];
        var prioritized = [];

        for (var p = 0; p < priorityOrder.length; p++) {
          for (var g = 0; g < rawGroups.length; g++) {
            if (rawGroups[g].toLowerCase() === priorityOrder[p]) {
              prioritized.push(rawGroups[g]);
              break;
            }
          }
        }

        var remaining = [];
        for (var r = 0; r < rawGroups.length; r++) {
          if (priorityOrder.indexOf(rawGroups[r].toLowerCase()) === -1) {
            remaining.push(rawGroups[r]);
          }
        }

        var orderedTabs = prioritized.concat(["All"], remaining);

        if (orderedTabs.indexOf(activeCategory) === -1) {
          activeCategory = prioritized.length > 0 ? prioritized[0] : "All";
        }

        categoryTabs.innerHTML = "";
        for (var t = 0; t < orderedTabs.length; t++) {
          var groupName = orderedTabs[t];
          var tab = document.createElement("div");
          tab.className = "tab" + (groupName === activeCategory ? " active" : "");
          tab.setAttribute("tabindex", "0");
          tab.setAttribute("data-category", groupName);
          tab.textContent = groupName;
          categoryTabs.appendChild(tab);
        }
      }

      function getPlayableUrl(rawUrl, forceProxy) {
        var isHttpsSite = window.location.protocol === "https:";
        var isHttpStream = rawUrl.indexOf("http://") === 0;
        if ((isHttpsSite && isHttpStream && true) || forceProxy) {
          return "/api/proxy?url=" + encodeURIComponent(rawUrl);
        }
        return rawUrl;
      }

      function appendCacheBuster(url) {
        if (url.indexOf("/api/proxy") === 0) return url;
        var sep = url.indexOf("?") === -1 ? "?" : "&";
        return url + sep + "_r=" + Date.now();
      }

      function teardownPlayer() {
        clearInterval(stallWatchdogTimer);
        if (hls) {
          try { hls.destroy(); } catch (e) {}
          hls = null;
        }
        video.onloadedmetadata = null;
        video.onplaying = null;
        video.onwaiting = null;
        video.onstalled = null;
        video.onended = null;
        video.onerror = null;
        try {
          video.pause();
          video.removeAttribute("src");
          video.load();
        } catch (e) {}
      }

      function safeVideoPlay() {
        try {
          var playPromise = video.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {
              video.muted = true;
              try {
                var mutedPromise = video.play();
                if (mutedPromise && typeof mutedPromise.then === "function") {
                  mutedPromise.then(function () {
                    setStatus("Playing (Muted)", "warn");
                  }).catch(function () {
                    setStatus("Tap Video to Play", "warn");
                  });
                }
              } catch (e2) {
                setStatus("Tap Video to Play", "warn");
              }
            });
          }
        } catch (err) {
          setStatus("Tap Video to Play", "warn");
        }
      }

      /* Direct Hardware Media Pipeline (<video src=".m3u8">) with Self-Healing Recovery
         Why live IPTV streams sometimes freeze for 10s, buffer, and go black:
         1. Live CDN playlist discontinuity / DTS timestamp reset (commercial break or encoder hiccup)
         2. Expired CDN session token in the .m3u8 URL
         3. LG webOS native HLS decoder stalling without firing onerror() */
      function startHardwarePlayback(streamUrl, channel, isProxyFallback, hwRecoveryAttempt) {
        teardownPlayer();
        currentEngineMode = "hw";
        var recoveryCount = hwRecoveryAttempt || 0;
        populateQualityDropdown([], true);
        setStatus(
          recoveryCount > 0 ? "Reconnecting HW (" + recoveryCount + ")..." :
          (isProxyFallback ? "Connecting (HW Proxy)..." : "Connecting (HW)..."),
          "warn"
        );

        video.preload = "auto";
        video.src = recoveryCount > 0 ? appendCacheBuster(streamUrl) : streamUrl;

        var hardwareBooted = false;

        video.onloadedmetadata = function () {
          hardwareBooted = true;
          stallCount = 0;
          setStatus(isProxyFallback ? "Live (HW Proxy)" : "Live (TV Hardware)", "ok");
          nudgeHardwareVideoPlane();
          safeVideoPlay();
        };

        video.onplaying = function () {
          nudgeHardwareVideoPlane();
          hardwareBooted = true;
          stallCount = 0;
          setStatus(isProxyFallback ? "Live (HW Proxy)" : "Live (TV Hardware)", "ok");
        };

        video.onwaiting = function () {
          if (hardwareBooted) {
            setStatus("Buffering...", "warn");
          }
        };

        video.onended = function () {
          // Live streams should never end; immediately re-attach fresh manifest
          if (activeChannelObj && activeChannelUrl === channel.url) {
            startHardwarePlayback(streamUrl, channel, isProxyFallback, recoveryCount + 1);
          }
        };

        video.onerror = function () {
          if (!isProxyFallback && streamUrl.indexOf("/api/proxy") !== 0 && true) {
            startHardwarePlayback(getPlayableUrl(channel.url, true), channel, true, 0);
            return;
          }
          if (typeof Hls !== "undefined" && Hls.isSupported()) {
            startMseFallbackPlayback(getPlayableUrl(channel.url, false), channel, false, -1);
          } else {
            setStatus("Stream Offline", "error");
          }
        };

        safeVideoPlay();

        /* Active Self-Healing Watchdog for LG TV Hardware Pipeline:
           - Checks every 2 seconds if video.currentTime is advancing.
           - At 4s freeze: nudges past any gap/discontinuity in buffer.
           - At 8s freeze (black screen / dead CDN session): automatically flushes the stuck
             hardware decoder and reloads the live stream (up to 2 HW resets, then fails over to MSE). */
        clearInterval(stallWatchdogTimer);
        stallCount = 0;
        lastPlaybackTime = 0;

        stallWatchdogTimer = setInterval(function () {
          if (!activeChannelObj || activeChannelUrl !== channel.url) return;

          if (!hardwareBooted) {
            stallCount++;
            if (stallCount >= 3) {
              clearInterval(stallWatchdogTimer);
              if (typeof Hls !== "undefined" && Hls.isSupported()) {
                startMseFallbackPlayback(getPlayableUrl(channel.url, false), channel, false, -1);
              } else {
                startHardwarePlayback(streamUrl, channel, isProxyFallback, recoveryCount + 1);
              }
            }
            return;
          }

          if (video.paused) return;

          var nowTime = video.currentTime;
          var hasNoVideoFrame = (video.readyState < 2 || video.videoWidth === 0);

          if (Math.abs(nowTime - lastPlaybackTime) < 0.15 || hasNoVideoFrame) {
            stallCount++;
            setStatus("Buffering (" + (stallCount * 2) + "s)...", "warn");

            // Step 1 (4s): Try jumping across timestamp hole to live edge
            if (stallCount === 2 && video.buffered && video.buffered.length > 0) {
              var bufEnd = video.buffered.end(video.buffered.length - 1);
              if (bufEnd - nowTime > 0.3) {
                try { video.currentTime = bufEnd - 0.1; } catch (e) {}
              }
            }

            // Step 2 (8s): Hardware decoder wedged / black screen -> auto-reset stream!
            if (stallCount >= 4) {
              clearInterval(stallWatchdogTimer);
              if (recoveryCount < 2) {
                startHardwarePlayback(streamUrl, channel, isProxyFallback, recoveryCount + 1);
              } else if (typeof Hls !== "undefined" && Hls.isSupported()) {
                // If HW decoder keeps freezing on this specific channel's stream format, switch to MSE
                startMseFallbackPlayback(getPlayableUrl(channel.url, false), channel, false, -1);
              } else {
                startHardwarePlayback(streamUrl, channel, isProxyFallback, 0);
              }
            }
          } else {
            if (stallCount > 0) {
              setStatus(isProxyFallback ? "Live (HW Proxy)" : "Live (TV Hardware)", "ok");
            }
            stallCount = 0;
          }
          lastPlaybackTime = nowTime;
        }, 2000);
      }

      /* JS MSE Playback with Default 720p / 480p Cap + Self-Healing Watchdog */
      function startMseFallbackPlayback(streamUrl, channel, isRetry, forcedLevel, capMaxHeight) {
        teardownPlayer();
        currentEngineMode = "mse";

        if (typeof Hls === "undefined" || !Hls.isSupported()) {
          if (supportsNativeHls) {
            startHardwarePlayback(streamUrl, channel, isRetry, 0);
          } else {
            setStatus("HLS Unsupported", "error");
          }
          return;
        }

        var activeCap = typeof capMaxHeight === "number" ? capMaxHeight : 0;

        hls = new Hls({
          enableWorker: false,
          startLevel: typeof forcedLevel === "number" ? forcedLevel : -1,
          autoStartLoad: true,
          capLevelToPlayerSize: false,
          maxBufferLength: 24,
          maxMaxBufferLength: 45,
          maxBufferHole: 0.8,
          liveSyncDurationCount: 4,
          liveMaxLatencyDurationCount: 12,
          fragLoadingTimeOut: 15000,
          fragLoadingMaxRetry: 6,
          manifestLoadingTimeOut: 10000,
          manifestLoadingMaxRetry: 4
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function (event, data) {
          var levels = (data && data.levels) ? data.levels : [];
          if (activeCap > 0 && levels.length > 0) {
            var cappedIdx = pickBestLevelForCap(levels, activeCap);
            hls.autoLevelCapping = cappedIdx;
            hls.currentLevel = cappedIdx;
            var capH = (levels[cappedIdx] && levels[cappedIdx].height) ? levels[cappedIdx].height + "p" : activeCap + "p";
            populateQualityDropdown(levels, false);
            setStatus("Live (" + capH + " Cap)", "ok");
          } else if (typeof forcedLevel === "number" && forcedLevel >= 0 && forcedLevel < levels.length) {
            hls.currentLevel = forcedLevel;
            var lockH = (levels[forcedLevel] && levels[forcedLevel].height) ? levels[forcedLevel].height + "p" : "Locked";
            populateQualityDropdown(levels, false);
            setStatus("Live (" + lockH + ")", "ok");
          } else {
            populateQualityDropdown(levels, false);
            setStatus(streamUrl.indexOf("/api/proxy") === 0 ? "Live (MSE Proxy)" : "Live (MSE)", "ok");
          }
          nudgeHardwareVideoPlane();
          safeVideoPlay();
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
          if (!hls || !hls.levels || !hls.levels[data.level]) return;
          var h = hls.levels[data.level].height;
          if (h) {
            setStatus(activeCap > 0 ? "Live (" + h + "p Cap)" : "Live (" + h + "p)", "ok");
          }
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          if (!data.fatal) return;

          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
            return;
          }

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            if (!isRetry && streamUrl.indexOf("/api/proxy") !== 0 && true) {
              startMseFallbackPlayback(getPlayableUrl(channel.url, true), channel, true, forcedLevel, activeCap);
              return;
            }
            setStatus("Reconnecting...", "warn");
            setTimeout(function () {
              if (hls && activeChannelUrl === channel.url) {
                hls.startLoad();
              }
            }, 1500);
            return;
          }

          // If MSE fails on a stream that native hardware can play, fail over cleanly
          if (supportsNativeHls) {
            startHardwarePlayback(streamUrl, channel, isRetry, 0);
          } else {
            setStatus("Stream Offline / Geo-Blocked", "error");
          }
        });

        clearInterval(stallWatchdogTimer);
        stallCount = 0;
        lastPlaybackTime = 0;
        stallWatchdogTimer = setInterval(function () {
          if (!hls || !activeChannelObj || activeChannelUrl !== channel.url) return;
          if (video.paused || video.ended) return;
          var nowTime = video.currentTime;
          if (Math.abs(nowTime - lastPlaybackTime) < 0.15) {
            stallCount++;
            if (stallCount === 2) {
              hls.startLoad();
            } else if (stallCount >= 4) {
              stallCount = 0;
              hls.recoverMediaError();
              hls.startLoad();
            }
          } else {
            stallCount = 0;
          }
          lastPlaybackTime = nowTime;
        }, 2000);
      }

      function startPlayback(streamUrl, channel) {
        if (preferredQualityMode === "hw" && supportsNativeHls) {
          startHardwarePlayback(streamUrl, channel, false, 0);
        } else if (preferredQualityMode === "cap-480") {
          startMseFallbackPlayback(streamUrl, channel, false, -1, 480);
        } else if (preferredQualityMode === "mse-auto") {
          startMseFallbackPlayback(streamUrl, channel, false, -1, 0);
        } else {
          // Default: 720p Cap (automatically selects 720p or 480p if 720p is not in manifest)
          startMseFallbackPlayback(streamUrl, channel, false, -1, 720);
        }
      }

      function updateActiveCardHighlight() {
        var cards = channelListEl.querySelectorAll(".channel-card");
        for (var i = 0; i < cards.length; i++) {
          var cardUrl = cards[i].getAttribute("data-url");
          if (cardUrl === activeChannelUrl) {
            addClass(cards[i], "active");
          } else {
            removeClass(cards[i], "active");
          }
        }
      }

      function playChannel(channel) {
        if (!channel) return;
        activeChannelUrl = channel.url;
        activeChannelObj = channel;

        try {
          localStorage.setItem(STORAGE_LAST_URL, channel.url);
        } catch (e) {}

        currentLogo.src = channel.logo;
        currentLogo.onerror = function () { currentLogo.src = FALLBACK_LOGO; };
        currentTitle.textContent = "#" + channel.num + "  " + channel.name;
        currentCategory.textContent = channel.group;

        updateActiveCardHighlight();

        if (window.location.protocol === "https:" && channel.url.indexOf("http://") === 0 && !true) {
          setStatus("Enable Auto-Proxy", "error");
          return;
        }

        var streamUrl = getPlayableUrl(channel.url, false);
        startPlayback(streamUrl, channel);
      }

      function stepChannel(delta) {
        var list = filteredChannels.length > 0 ? filteredChannels : channels;
        if (list.length === 0) return;

        var idx = -1;
        for (var i = 0; i < list.length; i++) {
          if (list[i].url === activeChannelUrl) {
            idx = i;
            break;
          }
        }
        var nextIdx = idx === -1 ? 0 : (idx + delta + list.length) % list.length;
        playChannel(list[nextIdx]);
      }

      function appendChannelBatch() {
        var existingBtn = document.getElementById("loadMoreChannelsBtn");
        if (existingBtn && existingBtn.parentNode) {
          existingBtn.parentNode.removeChild(existingBtn);
        }

        var end = Math.min(renderedCount + BATCH_SIZE, filteredChannels.length);
        var fragment = document.createDocumentFragment();

        for (var i = renderedCount; i < end; i++) {
          (function (ch, index) {
            var card = document.createElement("div");
            card.className = "channel-card" + (ch.url === activeChannelUrl ? " active" : "");
            card.setAttribute("tabindex", "0");
            card.setAttribute("data-index", index);
            card.setAttribute("data-url", ch.url);

            var img = document.createElement("img");
            img.src = ch.logo;
            img.alt = "";
            img.onerror = function () { this.src = FALLBACK_LOGO; };

            var infoDiv = document.createElement("div");
            infoDiv.className = "channel-info";

            var nameDiv = document.createElement("div");
            nameDiv.className = "channel-name";
            nameDiv.textContent = ch.num + ". " + ch.name;

            var groupDiv = document.createElement("div");
            groupDiv.className = "channel-group";
            groupDiv.textContent = ch.group;

            infoDiv.appendChild(nameDiv);
            infoDiv.appendChild(groupDiv);

            card.appendChild(img);
            card.appendChild(infoDiv);

            card.addEventListener("click", function () {
              if (video.muted) video.muted = false;
              playChannel(ch);
            });
            fragment.appendChild(card);
          })(filteredChannels[i], i);
        }

        renderedCount = end;
        channelListEl.appendChild(fragment);

        if (renderedCount < filteredChannels.length) {
          var moreBtn = document.createElement("button");
          moreBtn.id = "loadMoreChannelsBtn";
          moreBtn.className = "secondary load-more-btn";
          moreBtn.textContent = "Load More (" + (filteredChannels.length - renderedCount) + " remaining)";
          moreBtn.addEventListener("click", function () {
            appendChannelBatch();
          });
          channelListEl.appendChild(moreBtn);
        }
      }

      function renderChannels() {
        filteredChannels = [];
        var q = searchQuery.toLowerCase();
        for (var k = 0; k < channels.length; k++) {
          var chItem = channels[k];
          var matchesCat = activeCategory === "All" || chItem.group === activeCategory;
          var matchesSearch = chItem.name.toLowerCase().indexOf(q) !== -1;
          if (matchesCat && matchesSearch) {
            filteredChannels.push(chItem);
          }
        }

        channelCount.textContent = filteredChannels.length + " channels";
        channelListEl.innerHTML = "";
        channelListEl.scrollTop = 0;
        renderedCount = 0;

        appendChannelBatch();
      }

      channelListEl.addEventListener("scroll", function () {
        if (renderedCount >= filteredChannels.length) return;
        if (channelListEl.scrollTop + channelListEl.clientHeight >= channelListEl.scrollHeight - 160) {
          appendChannelBatch();
        }
      });

      /* LG Magic Remote & Keyboard Navigation */
      document.addEventListener("keydown", function (e) {
        var key = e.keyCode || e.which;
        var activeEl = document.activeElement;
        var isTyping = activeEl && (activeEl.tagName === "INPUT" || activeEl.tagName === "SELECT");

        if (video.muted) {
          video.muted = false;
        }

        if (!isTyping && (key === 70 || key === 102)) {
          e.preventDefault();
          toggleFullDisplay();
          return;
        }

        if (!isTyping && key >= 48 && key <= 57) {
          var digit = String(key - 48);
          zapDigits += digit;
          setStatus("CH " + zapDigits + "...", "warn");

          clearTimeout(zapTimer);
          zapTimer = setTimeout(function () {
            var targetNum = parseInt(zapDigits, 10);
            zapDigits = "";
            for (var i = 0; i < channels.length; i++) {
              if (channels[i].num === targetNum) {
                playChannel(channels[i]);
                break;
              }
            }
          }, 1100);
          return;
        }

        if (key === 427 || key === 33) {
          e.preventDefault();
          stepChannel(-1);
          return;
        }
        if (key === 428 || key === 34) {
          e.preventDefault();
          stepChannel(1);
          return;
        }

        if (key === 461 || key === 27) {
          if (isFullDisplay) {
            e.preventDefault();
            toggleFullDisplay();
            return;
          }
          return;
        }

        if (activeEl && hasClass(activeEl, "channel-card")) {
          var idx = parseInt(activeEl.getAttribute("data-index"), 10);
          var cards = channelListEl.querySelectorAll(".channel-card");

          if (key === 13) {
            e.preventDefault();
            activeEl.click();
          } else if (key === 39) {
            e.preventDefault();
            if (idx + 1 >= renderedCount && renderedCount < filteredChannels.length) {
              appendChannelBatch();
              cards = channelListEl.querySelectorAll(".channel-card");
            }
            if (cards[idx + 1]) cards[idx + 1].focus();
          } else if (key === 37) {
            e.preventDefault();
            if (cards[idx - 1]) cards[idx - 1].focus();
          } else if (key === 40) {
            e.preventDefault();
            if (idx + 2 >= renderedCount && renderedCount < filteredChannels.length) {
              appendChannelBatch();
              cards = channelListEl.querySelectorAll(".channel-card");
            }
            if (cards[idx + 2]) cards[idx + 2].focus();
          } else if (key === 38) {
            e.preventDefault();
            if (idx - 2 >= 0 && cards[idx - 2]) {
              cards[idx - 2].focus();
            } else {
              var activeTab = categoryTabs.querySelector(".tab.active") || categoryTabs.querySelector(".tab");
              if (activeTab) activeTab.focus();
            }
          }
          return;
        }

        if (activeEl && hasClass(activeEl, "tab")) {
          var tabs = Array.prototype.slice.call(categoryTabs.querySelectorAll(".tab"));
          var tIdx = tabs.indexOf(activeEl);
          if (key === 39 && tabs[tIdx + 1]) {
            e.preventDefault();
            tabs[tIdx + 1].focus();
          } else if (key === 37 && tabs[tIdx - 1]) {
            e.preventDefault();
            tabs[tIdx - 1].focus();
          } else if (key === 40) {
            e.preventDefault();
            var firstCard = channelListEl.querySelector(".channel-card.active") || channelListEl.querySelector(".channel-card");
            if (firstCard) firstCard.focus();
          } else if (key === 13) {
            e.preventDefault();
            activeEl.click();
          }
        }
      });

      categoryTabs.addEventListener("click", function (e) {
        if (!hasClass(e.target, "tab")) return;
        var allTabs = categoryTabs.querySelectorAll(".tab");
        for (var i = 0; i < allTabs.length; i++) removeClass(allTabs[i], "active");
        addClass(e.target, "active");
        activeCategory = e.target.getAttribute("data-category");
        renderChannels();
      });

      searchInput.addEventListener("input", function (e) {
        searchQuery = e.target.value;
        renderChannels();
      });

      prevChBtn.addEventListener("click", function () {
        if (video.muted) video.muted = false;
        stepChannel(-1);
      });

      nextChBtn.addEventListener("click", function () {
        if (video.muted) video.muted = false;
        stepChannel(1);
      });

      function initializeStartupPlayback() {
        var savedUrl = null;
        try { savedUrl = localStorage.getItem(STORAGE_LAST_URL); } catch (e) {}

        var startChannel = null;
        if (savedUrl) {
          for (var i = 0; i < channels.length; i++) {
            if (channels[i].url === savedUrl) {
              startChannel = channels[i];
              break;
            }
          }
        }
        if (!startChannel) {
          startChannel = filteredChannels.length > 0 ? filteredChannels[0] : channels[0];
        }
        if (startChannel) {
          playChannel(startChannel);
        }
      }

      function loadBuiltinFallback() {
        channels = [];
        for (var idx = 0; idx < BUILTIN_CHANNELS.length; idx++) {
          var c = BUILTIN_CHANNELS[idx];
          channels.push({ num: idx + 1, name: c.name, group: c.group, logo: c.logo, url: c.url });
        }
        activeCategory = "Bangladesh";
        buildCategoryTabs();
        renderChannels();
        initializeStartupPlayback();
      }

      function loadM3UPlaylist(url) {
        setStatus("Loading Channels...", "warn");
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.timeout = 8000;

        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
              var parsed = parseM3U(xhr.responseText);
              if (parsed.length > 0) {
                channels = parsed;
                activeCategory = "Bangladesh";
                buildCategoryTabs();
                renderChannels();
                initializeStartupPlayback();
                return;
              }
            }
            loadBuiltinFallback();
          }
        };

        xhr.onerror = function () {
          loadBuiltinFallback();
        };

        xhr.ontimeout = function () {
          loadBuiltinFallback();
        };

        try {
          xhr.send();
        } catch (err) {
          loadBuiltinFallback();
        }
      }

      loadM3UPlaylist(DEFAULT_M3U_URL);
    })();
  </script>
</body>
</html>
