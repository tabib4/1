<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPTV PRO - AJMAIN ABRAR TABIB</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --bg-card: #334155;
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: var(--bg-secondary);
      padding: 0.75rem 1.25rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.65rem;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.3px;
    }

    .header-search {
      display: flex;
      align-items: center;
    }

    input[type="text"], input[type="url"] {
      background: var(--bg-primary);
      border: 1px solid var(--border);
      color: var(--text-primary);
      padding: 0.45rem 0.75rem;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
    }

    input[type="text"] {
      width: 240px;
    }

    input[type="url"] {
      width: 100%;
      max-width: 420px;
    }

    input:focus {
      border-color: var(--accent);
    }

    .btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 0.45rem 0.8rem;
      border-radius: 6px;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    .btn-secondary {
      background: var(--bg-card);
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 0.35rem;
      font-size: 0.82rem;
      color: var(--text-secondary);
      background: var(--bg-primary);
      padding: 0.43rem 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      cursor: pointer;
      user-select: none;
    }

    .main-layout {
      display: grid;
      grid-template-columns: 1fr 440px;
      gap: 1rem;
      padding: 0.85rem 1rem;
      flex: 1;
      max-width: 1600px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 960px) {
      .main-layout {
        grid-template-columns: 1fr;
        padding: 0.75rem;
        gap: 0.75rem;
      }
      .header-search {
        width: 100%;
      }
      input[type="text"] {
        width: 100%;
      }
      .sidebar {
        max-height: none;
      }
    }

    .player-section {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .video-container {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 10px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    video {
      width: 100%;
      height: 100%;
      display: block;
    }

    .now-playing {
      background: var(--bg-secondary);
      padding: 0.85rem 1rem;
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .now-playing-info {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .now-playing-info img {
      width: 42px;
      height: 42px;
      object-fit: contain;
      background: #0f172a;
      border-radius: 8px;
      padding: 4px;
    }

    .status-badge {
      font-size: 0.78rem;
      padding: 0.25rem 0.6rem;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
    }

    .status-badge.error {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .sidebar {
      background: var(--bg-secondary);
      border-radius: 10px;
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 95px);
      overflow: hidden;
    }

    .category-tabs {
      display: flex;
      gap: 0.35rem;
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
    }

    .category-tabs::-webkit-scrollbar {
      height: 4px;
    }

    .category-tabs::-webkit-scrollbar-thumb {
      background: var(--bg-card);
      border-radius: 4px;
    }

    .tab-btn {
      background: var(--bg-primary);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      font-weight: 600;
    }

    .channel-count {
      font-size: 0.75rem;
      color: var(--text-secondary);
      padding: 0.45rem 0.75rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
    }

    .count-actions {
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }

    .mini-btn {
      background: var(--bg-card);
      color: var(--text-primary);
      border: 1px solid var(--border);
      padding: 0.2rem 0.5rem;
      border-radius: 5px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mini-btn.active {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .mini-btn.restore {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      border-color: rgba(56, 189, 248, 0.3);
    }

    /* 2-Column Grid Layout for Channels */
    .channel-list {
      overflow-y: auto;
      padding: 0.6rem;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.5rem;
      flex: 1;
      align-content: start;
    }

    .channel-item {
      position: relative;
      display: flex;
      align-items: center;
      gap: 0.55rem;
      padding: 0.5rem 0.6rem;
      background: var(--bg-primary);
      border: 1px solid transparent;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.15s ease;
      min-width: 0;
    }

    .channel-item:hover {
      border-color: var(--accent);
      background: #172033;
    }

    .channel-item.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.14);
    }

    .channel-item img {
      width: 32px;
      height: 32px;
      object-fit: contain;
      background: var(--bg-secondary);
      border-radius: 6px;
      padding: 2px;
      flex-shrink: 0;
    }

    .channel-meta {
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-width: 0;
      flex: 1;
    }

    .channel-name {
      font-size: 0.84rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .channel-group {
      font-size: 0.7rem;
      color: var(--text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .remove-btn {
      display: none;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: none;
      background: var(--danger);
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .channel-list.edit-mode .remove-btn {
      display: flex;
    }

    .channel-list.edit-mode .channel-item {
      border-color: rgba(239, 68, 68, 0.45);
    }

    .notice {
      font-size: 0.74rem;
      color: var(--text-secondary);
      padding: 0.55rem 0.75rem;
      background: rgba(15, 23, 42, 0.6);
      border-top: 1px solid var(--border);
    }

    footer.playlist-footer {
      background-color: var(--bg-secondary);
      border-top: 1px solid var(--border);
      padding: 1rem 1.25rem;
      margin-top: 0.5rem;
    }

    .footer-inner {
      max-width: 1600px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    .footer-label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .footer-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      align-items: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <span>📺</span>
      <span>IPTV PRO - AJMAIN ABRAR TABIB</span>
    </div>
    <div class="header-search">
      <input type="text" id="searchInput" placeholder="Search channels..." />
    </div>
  </header>

  <main class="main-layout">
    <section class="player-section">
      <div class="video-container">
        <video id="videoPlayer" controls playsinline></video>
      </div>

      <div class="now-playing">
        <div class="now-playing-info">
          <img id="currentLogo" src="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/btv-national-2db28e10.png" alt="Channel Logo" />
          <div>
            <h2 id="currentTitle" style="font-size: 1rem;">Select a channel to start watching</h2>
            <p id="currentCategory" style="font-size: 0.8rem; color: var(--text-secondary);">Ready</p>
          </div>
        </div>
        <span id="streamStatus" class="status-badge">Idle</span>
      </div>
    </section>

    <aside class="sidebar">
      <div class="category-tabs" id="categoryTabs">
        <button class="tab-btn active" data-category="All">All</button>
      </div>

      <div class="channel-count">
        <span id="visibleCount">0 channels</span>
        <div class="count-actions">
          <button class="mini-btn restore" id="restoreBtn" style="display:none;">Restore (<span id="hiddenCount">0</span>)</button>
          <button class="mini-btn" id="editModeBtn">Remove Channels</button>
        </div>
      </div>

      <div class="channel-list" id="channelList"></div>

      <div class="notice" id="playlistStatus">
        Tap "Remove Channels" to hide unwanted channels (saved on your device).
      </div>
    </aside>
  </main>

  <footer class="playlist-footer">
    <div class="footer-inner">
      <span class="footer-label">Playlist & Proxy Settings</span>
      <div class="footer-controls">
        <input type="url" id="m3uUrlInput" value="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/IPTV-Playlist.m3u" placeholder="Enter M3U Playlist URL..." />
        <button class="btn" id="loadPlaylistBtn">Load URL</button>
        <label class="btn btn-secondary" style="cursor:pointer;">
          Upload .M3U
          <input type="file" id="fileInput" accept=".m3u,.m3u8" style="display:none;" />
        </label>
        <label class="toggle-label" title="Routes HTTP streams (and failed HTTPS streams) through Vercel /api/proxy">
          <input type="checkbox" id="proxyToggle" checked />
          Auto-Proxy HTTP
        </label>
      </div>
    </div>
  </footer>

  <script>
    const DEFAULT_M3U_URL = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/IPTV-Playlist.m3u";
    const FALLBACK_LOGO = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/btv-national-2db28e10.png";
    const STORAGE_KEY = "bd_iptv_hidden_channels_v1";

    const BUILTIN_CHANNELS = [
      { name: "ATN Bangla", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/atn-bangla.png", url: "https://tvsen5.aynaott.com/atnbangla/index.m3u8" },
      { name: "Bangla Vision", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/banglavision.png", url: "https://tvsen5.aynaott.com/banglavision/index.m3u8" },
      { name: "BTV National", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/btv-national-2db28e10.png", url: "https://nkafmbewiff.gpcdn.net/tile_2/master.m3u8" },
      { name: "Channel 24", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/channel-24.png", url: "https://tvsen6.aynaott.com/YrVDF8gujkdh/index.m3u8" },
      { name: "Channel I", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/channel-i.png", url: "https://tvsen6.aynaott.com/FNHpYvGZ7FkCE10PwTHm/index.m3u8" },
      { name: "Deepto TV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/deepto-tv.png", url: "https://byphdgllyk.gpcdn.net/hls/deeptotv/index.m3u8" },
      { name: "Ekattor TV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/ekattor-tv.png", url: "https://tvsen6.aynaott.com/EWDrV5QskgarZEUBb3pU/index.m3u8" },
      { name: "Jamuna TV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/jamuna-tv.png", url: "https://tvsen6.aynaott.com/KGdZEdA7qQ43dmPkgk1j/index.m3u8" },
      { name: "Maasranga TV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/maasranga-tv.png", url: "https://mtv.sunplex.live/MAASRANGA/index.m3u8" },
      { name: "NTV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/ntv.png", url: "https://tvsen5.aynaott.com/xV4jEKf3D9zc/index.m3u8" },
      { name: "RTV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/rtv.png", url: "https://tvsen5.aynaott.com/RtvHD/index.m3u8" },
      { name: "Somoy TV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/somoy-tv.png", url: "https://tvsen6.aynaott.com/4XcqdovJzbbC9WdJA9gk/index.m3u8" },
      { name: "A Sports", group: "Sports", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/a-sports-65a3e1d8fd.png", url: "https://playztv-apps.pages.dev/a-sports/index.m3u8" },
      { name: "Star Sports 1 Hindi", group: "Sports", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/star-sports-1-hindi.png", url: "https://starsportshindiii.pages.dev/index.m3u8" },
      { name: "Duronto TV", group: "Kids", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/duronto-tv-2b3c7dd202.png", url: "https://tvsen5.aynaott.com/6xyZ3N4oHv2KBJdB6W4p/index.fmp4.m3u8" }
    ];

    const video = document.getElementById("videoPlayer");
    const channelListEl = document.getElementById("channelList");
    const searchInput = document.getElementById("searchInput");
    const m3uUrlInput = document.getElementById("m3uUrlInput");
    const loadPlaylistBtn = document.getElementById("loadPlaylistBtn");
    const fileInput = document.getElementById("fileInput");
    const proxyToggle = document.getElementById("proxyToggle");
    const categoryTabs = document.getElementById("categoryTabs");
    const currentLogo = document.getElementById("currentLogo");
    const currentTitle = document.getElementById("currentTitle");
    const currentCategory = document.getElementById("currentCategory");
    const streamStatus = document.getElementById("streamStatus");
    const playlistStatus = document.getElementById("playlistStatus");
    const visibleCount = document.getElementById("visibleCount");
    const editModeBtn = document.getElementById("editModeBtn");
    const restoreBtn = document.getElementById("restoreBtn");
    const hiddenCount = document.getElementById("hiddenCount");

    let channels = [];
    let hiddenUrls = new Set(JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]"));
    let isEditMode = false;
    let activeCategory = "All";
    let searchQuery = "";
    let activeChannelUrl = null;
    let hls = null;

    function saveHiddenChannels() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...hiddenUrls]));
      updateRestoreButton();
    }

    function updateRestoreButton() {
      const count = hiddenUrls.size;
      hiddenCount.textContent = count;
      restoreBtn.style.display = count > 0 ? "inline-block" : "none";
    }

    function setStatus(text, isError = false) {
      streamStatus.textContent = text;
      streamStatus.className = isError ? "status-badge error" : "status-badge";
    }

    function parseM3U(m3uText) {
      const lines = m3uText.split(/\r?\n/);
      const parsedChannels = [];
      let currentInfo = null;

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i].trim();
        if (!line) continue;

        if (line.startsWith("#EXTINF:")) {
          const logoMatch = line.match(/tvg-logo="([^"]*)"/i);
          const groupMatch = line.match(/group-title="([^"]*)"/i);
          const commaIndex = line.lastIndexOf(",");
          const name = commaIndex !== -1 ? line.substring(commaIndex + 1).trim() : "Unknown Channel";

          currentInfo = {
            name: name || "Unknown Channel",
            logo: (logoMatch && logoMatch[1]) ? logoMatch[1] : FALLBACK_LOGO,
            group: (groupMatch && groupMatch[1]) ? groupMatch[1] : "Uncategorized"
          };
        } else if (!line.startsWith("#") && currentInfo) {
          parsedChannels.push({
            ...currentInfo,
            url: line
          });
          currentInfo = null;
        }
      }

      return parsedChannels;
    }

    function buildCategoryTabs() {
      const visibleChannels = channels.filter(ch => !hiddenUrls.has(ch.url));
      const groups = ["All", ...new Set(visibleChannels.map(ch => ch.group))];
      if (!groups.includes(activeCategory)) activeCategory = "All";
      categoryTabs.innerHTML = "";

      groups.forEach(group => {
        const btn = document.createElement("button");
        btn.className = "tab-btn" + (group === activeCategory ? " active" : "");
        btn.dataset.category = group;
        btn.textContent = group;
        categoryTabs.appendChild(btn);
      });
    }

    async function loadM3UPlaylist(url) {
      playlistStatus.textContent = "Fetching playlist...";
      channelListEl.innerHTML = "";

      try {
        const response = await fetch(url);
        if (!response.ok) throw new Error("HTTP " + response.status);
        const text = await response.text();
        const parsed = parseM3U(text);
        if (parsed.length === 0) throw new Error("No channels found in M3U");

        channels = parsed;
        activeCategory = "All";
        buildCategoryTabs();
        renderChannels();
        playlistStatus.textContent = "Playlist loaded. Tap 'Remove Channels' to hide unwanted ones.";
      } catch (err) {
        channels = BUILTIN_CHANNELS;
        activeCategory = "All";
        buildCategoryTabs();
        renderChannels();
        playlistStatus.textContent = "Using built-in channel list.";
      }
    }

    function getPlayableUrl(rawUrl, forceProxy = false) {
      const isHttpsSite = window.location.protocol === "https:";
      const isHttpStream = rawUrl.startsWith("http://");

      if ((isHttpsSite && isHttpStream && proxyToggle.checked) || forceProxy) {
        return `/api/proxy?url=${encodeURIComponent(rawUrl)}`;
      }
      return rawUrl;
    }

    function startPlayback(streamUrl, channel, isRetry = false) {
      if (hls) {
        hls.destroy();
        hls = null;
      }

      if (typeof Hls !== "undefined" && Hls.isSupported()) {
        hls = new Hls({
          enableWorker: true,
          lowLatencyMode: true
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          setStatus(streamUrl.startsWith("/api/proxy") ? "Live (Proxied)" : "Live");
          video.play().catch(() => setStatus("Click Video to Play"));
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            if (!isRetry && !streamUrl.startsWith("/api/proxy") && proxyToggle.checked) {
              setStatus("Retrying via Proxy...");
              startPlayback(getPlayableUrl(channel.url, true), channel, true);
            } else {
              setStatus("Stream Offline / Geo-Blocked", true);
            }
          }
        });
      } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
        video.src = streamUrl;
        video.onloadedmetadata = () => {
          setStatus("Live");
          video.play().catch(() => setStatus("Click Video to Play"));
        };
        video.onerror = () => setStatus("Stream Offline", true);
      } else {
        setStatus("HLS Not Supported", true);
      }
    }

    function playChannel(channel) {
      activeChannelUrl = channel.url;
      currentLogo.src = channel.logo;
      currentLogo.onerror = () => { currentLogo.src = FALLBACK_LOGO; };
      currentTitle.textContent = channel.name;
      currentCategory.textContent = channel.group;
      renderChannels();

      if (window.location.protocol === "https:" && channel.url.startsWith("http://") && !proxyToggle.checked) {
        setStatus("Blocked (Enable Auto-Proxy)", true);
        return;
      }

      const streamUrl = getPlayableUrl(channel.url, false);
      setStatus(streamUrl.startsWith("/api/proxy") ? "Connecting via Proxy..." : "Connecting...");
      startPlayback(streamUrl, channel, false);
    }

    function removeChannel(url) {
      hiddenUrls.add(url);
      saveHiddenChannels();
      buildCategoryTabs();
      renderChannels();
    }

    function renderChannels() {
      const filtered = channels.filter(ch => {
        if (hiddenUrls.has(ch.url)) return false;
        const matchesCat = activeCategory === "All" || ch.group === activeCategory;
        const matchesSearch = ch.name.toLowerCase().includes(searchQuery.toLowerCase());
        return matchesCat && matchesSearch;
      });

      visibleCount.textContent = filtered.length + " channels";
      channelListEl.innerHTML = "";

      const fragment = document.createDocumentFragment();

      filtered.forEach(ch => {
        const item = document.createElement("div");
        item.className = "channel-item" + (ch.url === activeChannelUrl ? " active" : "");
        item.innerHTML = `
          <img src="${ch.logo}" alt="${ch.name}" loading="lazy" onerror="this.src='${FALLBACK_LOGO}'" />
          <div class="channel-meta">
            <span class="channel-name" title="${ch.name}">${ch.name}</span>
            <span class="channel-group">${ch.group}</span>
          </div>
          <button class="remove-btn" title="Remove ${ch.name}" aria-label="Remove ${ch.name}">✕</button>
        `;

        item.querySelector(".remove-btn").addEventListener("click", (e) => {
          e.stopPropagation();
          removeChannel(ch.url);
        });

        item.addEventListener("click", () => {
          if (isEditMode) {
            removeChannel(ch.url);
          } else {
            playChannel(ch);
          }
        });

        fragment.appendChild(item);
      });

      channelListEl.appendChild(fragment);
    }

    editModeBtn.addEventListener("click", () => {
      isEditMode = !isEditMode;
      editModeBtn.classList.toggle("active", isEditMode);
      editModeBtn.textContent = isEditMode ? "Done" : "Remove Channels";
      channelListEl.classList.toggle("edit-mode", isEditMode);
    });

    restoreBtn.addEventListener("click", () => {
      hiddenUrls.clear();
      saveHiddenChannels();
      buildCategoryTabs();
      renderChannels();
    });

    categoryTabs.addEventListener("click", (e) => {
      if (!e.target.classList.contains("tab-btn")) return;
      document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
      e.target.classList.add("active");
      activeCategory = e.target.dataset.category;
      renderChannels();
    });

    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderChannels();
    });

    loadPlaylistBtn.addEventListener("click", () => {
      const url = m3uUrlInput.value.trim();
      if (url) loadM3UPlaylist(url);
    });

    fileInput.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        const parsed = parseM3U(ev.target.result);
        if (parsed.length > 0) {
          channels = parsed;
          activeCategory = "All";
          buildCategoryTabs();
          renderChannels();
          playlistStatus.textContent = "Loaded: " + file.name;
        }
      };
      reader.readAsText(file);
    });

    updateRestoreButton();
    loadM3UPlaylist(DEFAULT_M3U_URL);
  </script>
</body>
</html>
