<body>

  <header>
    <div class="brand">
      <span>IPTV -</span>
      <span class="brand-name">AJMAIN ABRAR TABIB</span>
    </div>
    <div class="header-actions">
      <button class="settings-toggle-btn" id="settingsToggleBtn" title="Playlist &amp; Stream Settings">⚙</button>
    </div>

    <div class="settings-drawer" id="settingsDrawer">
      <div class="drawer-title">Playlist &amp; Stream Settings</div>
      <div class="playlist-controls">
        <input type="url" id="m3uUrlInput" placeholder="Enter M3U Playlist URL..." style="flex:1; min-width:200px;" />
        <button id="loadUrlBtn">Load URL</button>
        <label class="file-label">
          Upload .M3U
          <input type="file" id="fileInput" accept=".m3u,.m3u8" style="display:none;" />
        </label>
        <label class="proxy-toggle" title="Route HTTP streams through HTTPS proxy">
          <input type="checkbox" id="proxyToggle" checked />
          Auto-Proxy HTTP
        </label>
        <button class="secondary" id="resetDefaultBtn">Reset Default</button>
      </div>
    </div>
  </header>

  <div class="main-container">
    <section class="player-section">
      <video id="videoPlayer" controls playsinline webkit-playsinline autoplay></video>
      <div class="now-playing-bar">
        <div class="channel-meta" id="nowPlayingBox">
          <img id="currentLogo" src="https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/btv-national-2db28e10.png" alt="Logo" />
          <div style="min-width:0;">
            <div class="now-playing-title" id="currentTitle">Loading Channels...</div>
            <div class="now-playing-sub" id="currentCategory">Bangladesh</div>
          </div>
        </div>
        <div class="player-controls-right">
          <button class="secondary" id="prevChBtn" title="Previous Channel">◀ Prev</button>
          <button class="secondary" id="nextChBtn" title="Next Channel">Next ▶</button>
          <button class="secondary" id="engineBtn" title="Switch Hardware / Software Engine">HW</button>
          <button class="secondary" id="aspectBtn" title="Toggle Fit / Fill">Fit</button>
          <span class="status-badge" id="qualityBadge">TV Hardware</span>
          <span class="status-badge" id="streamStatus">Idle</span>
        </div>
      </div>
    </section>

    <aside class="sidebar">
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Search channels..." />
      </div>
      <div class="category-tabs" id="categoryTabs"></div>
      <div class="channel-count">
        <span>CH ▲/▼ • 0-9 Zap</span>
        <span id="channelCount">0 channels</span>
      </div>
      <div class="channel-list" id="channelList"></div>
    </aside>
  </div>

  <script>
    (function () {
      var DEFAULT_M3U_URL = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/IPTV-Playlist.m3u";
      var FALLBACK_LOGO = "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/btv-national-2db28e10.png";
      var STORAGE_LAST_URL = "iptv_first_last_ch_v1";
      var STORAGE_CUSTOM_M3U = "iptv_first_custom_m3u_v1";
      var BATCH_SIZE = 40;

      var BUILTIN_CHANNELS = [
        { name: "ATN Bangla", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/atn-bangla.png", url: "https://tvsen5.aynaott.com/atnbangla/index.m3u8" },
        { name: "Bangla Vision", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/banglavision.png", url: "https://tvsen5.aynaott.com/banglavision/index.m3u8" },
        { name: "BTV National", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/btv-national-2db28e10.png", url: "https://nkafmbewiff.gpcdn.net/tile_2/master.m3u8" },
        { name: "Channel 24", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/channel-24.png", url: "https://tvsen6.aynaott.com/YrVDF8gujkdh/index.m3u8" },
        { name: "Channel I", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/channel-i.png", url: "https://tvsen6.aynaott.com/FNHpYvGZ7FkCE10PwTHm/index.m3u8" },
        { name: "Deepto TV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/deepto-tv.png", url: "https://byphdgllyk.gpcdn.net/hls/deeptotv/index.m3u8" },
        { name: "Ekattor TV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/ekattor-tv.png", url: "https://tvsen6.aynaott.com/EWDrV5QskgarZEUBb3pU/index.m3u8" },
        { name: "Jamuna TV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/jamuna-tv.png", url: "https://tvsen6.aynaott.com/KGdZEdA7qQ43dmPkgk1j/index.m3u8" },
        { name: "Maasranga TV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/maasranga-tv.png", url: "https://mtv.sunplex.live/MAASRANGA/index.m3u8" },
        { name: "NTV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/ntv.png", url: "https://tvsen5.aynaott.com/xV4jEKf3D9zc/index.m3u8" },
        { name: "RTV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/rtv.png", url: "https://tvsen5.aynaott.com/RtvHD/index.m3u8" },
        { name: "Somoy TV", group: "Bangladesh", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/somoy-tv.png", url: "https://tvsen6.aynaott.com/4XcqdovJzbbC9WdJA9gk/index.m3u8" },
        { name: "A Sports", group: "Sports", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/a-sports-65a3e1d8fd.png", url: "https://playztv-apps.pages.dev/a-sports/index.m3u8" },
        { name: "Star Sports 1 Hindi", group: "Sports", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/star-sports-1-hindi.png", url: "https://starsportshindiii.pages.dev/index.m3u8" },
        { name: "Duronto TV", group: "Kids", logo: "https://raw.githubusercontent.com/saeidrahmanbd/BDIX-IPTV/main/logos/duronto-tv-2b3c7dd202.png", url: "https://tvsen5.aynaott.com/6xyZ3N4oHv2KBJdB6W4p/index.fmp4.m3u8" }
      ];

      var video = document.getElementById("videoPlayer");
      var channelListEl = document.getElementById("channelList");
      var categoryTabs = document.getElementById("categoryTabs");
      var searchInput = document.getElementById("searchInput");
      var channelCount = document.getElementById("channelCount");
      var currentLogo = document.getElementById("currentLogo");
      var currentTitle = document.getElementById("currentTitle");
      var currentCategory = document.getElementById("currentCategory");
      var streamStatus = document.getElementById("streamStatus");
      var qualityBadge = document.getElementById("qualityBadge");
      var m3uUrlInput = document.getElementById("m3uUrlInput");
      var loadUrlBtn = document.getElementById("loadUrlBtn");
      var resetDefaultBtn = document.getElementById("resetDefaultBtn");
      var fileInput = document.getElementById("fileInput");
      var proxyToggle = document.getElementById("proxyToggle");
      var settingsToggleBtn = document.getElementById("settingsToggleBtn");
      var settingsDrawer = document.getElementById("settingsDrawer");
      var prevChBtn = document.getElementById("prevChBtn");
      var nextChBtn = document.getElementById("nextChBtn");
      var engineBtn = document.getElementById("engineBtn");
      var aspectBtn = document.getElementById("aspectBtn");

      var channels = [];
      var filteredChannels = [];
      var renderedCount = 0;
      var activeCategory = "Bangladesh";
      var searchQuery = "";
      var activeChannelUrl = null;
      var activeChannelObj = null;
      var hls = null;

      var stallWatchdogTimer = null;
      var lastPlaybackTime = 0;
      var stallCount = 0;
      var isZoomFill = false;
      var zapDigits = "";
      var zapTimer = null;

      // Prefer Hardware Native HLS (<video src=".m3u8">) FIRST on any device that supports it
      // (both LG webOS TV hardware pipeline AND iPhone Safari hardware pipeline!)
      // Only use JS Hls.js MSE on desktop Chrome/Firefox where native HLS is unsupported.
      var supportsNativeHls = !!(video && video.canPlayType && video.canPlayType("application/vnd.apple.mpegurl"));
      var preferHardwareEngine = supportsNativeHls;

      function updateEngineButton() {
        engineBtn.textContent = preferHardwareEngine ? "HW" : "MSE";
        engineBtn.title = preferHardwareEngine ? "Hardware Pipeline Active (Click to switch to MSE)" : "JS MSE Pipeline Active (Click to switch to Hardware)";
      }
      updateEngineButton();

      function hasClass(el, cls) {
        return (" " + el.className + " ").indexOf(" " + cls + " ") !== -1;
      }

      function addClass(el, cls) {
        if (!hasClass(el, cls)) {
          el.className = (el.className ? el.className + " " : "") + cls;
        }
      }

      function removeClass(el, cls) {
        el.className = (" " + el.className + " ").replace(" " + cls + " ", " ").replace(/^\s+|\s+$/g, "");
      }

      function setStatus(text, type) {
        streamStatus.textContent = text;
        streamStatus.className = "status-badge" + (type ? " " + type : "");
      }

      function updateQualityBadge(text, isDegraded) {
        qualityBadge.textContent = text;
        qualityBadge.className = isDegraded ? "status-badge warn" : "status-badge";
      }

      settingsToggleBtn.addEventListener("click", function (e) {
        e.stopPropagation();
        if (hasClass(settingsDrawer, "open")) {
          removeClass(settingsDrawer, "open");
          removeClass(settingsToggleBtn, "active");
        } else {
          addClass(settingsDrawer, "open");
          addClass(settingsToggleBtn, "active");
        }
      });

      document.addEventListener("click", function (e) {
        if (!settingsDrawer.contains(e.target) && e.target !== settingsToggleBtn) {
          removeClass(settingsDrawer, "open");
          removeClass(settingsToggleBtn, "active");
        }
      });

      aspectBtn.addEventListener("click", function () {
        isZoomFill = !isZoomFill;
        if (isZoomFill) {
          addClass(video, "zoom-fill");
          aspectBtn.textContent = "Fill";
        } else {
          removeClass(video, "zoom-fill");
          aspectBtn.textContent = "Fit";
        }
      });

      engineBtn.addEventListener("click", function () {
        preferHardwareEngine = !preferHardwareEngine;
        updateEngineButton();
        if (activeChannelObj) {
          playChannel(activeChannelObj);
        }
      });

      function parseM3U(m3uText) {
        var lines = m3uText.split(/\r?\n/);
        var parsed = [];
        var currentInfo = null;

        for (var i = 0; i < lines.length; i++) {
          var line = lines[i].replace(/^\s+|\s+$/g, "");
          if (!line) continue;

          if (line.indexOf("#EXTINF:") === 0) {
            var logoMatch = line.match(/tvg-logo="([^"]*)"/i);
            var groupMatch = line.match(/group-title="([^"]*)"/i);
            var commaIdx = line.lastIndexOf(",");
            var name = commaIdx !== -1 ? line.substring(commaIdx + 1).replace(/^\s+|\s+$/g, "") : "Channel";

            currentInfo = {
              name: name || "Channel",
              logo: (logoMatch && logoMatch[1]) ? logoMatch[1] : FALLBACK_LOGO,
              group: (groupMatch && groupMatch[1]) ? groupMatch[1] : "Others"
            };
          } else if (line.charAt(0) !== "#" && currentInfo) {
            parsed.push({
              num: parsed.length + 1,
              name: currentInfo.name,
              logo: currentInfo.logo,
              group: currentInfo.group,
              url: line
            });
            currentInfo = null;
          }
        }
        return parsed;
      }

      function buildCategoryTabs() {
        var rawGroups = [];
        for (var i = 0; i < channels.length; i++) {
          if (rawGroups.indexOf(channels[i].group) === -1) {
            rawGroups.push(channels[i].group);
          }
        }

        var priorityOrder = ["bangladesh", "india", "kids"];
        var prioritized = [];

        for (var p = 0; p < priorityOrder.length; p++) {
          for (var g = 0; g < rawGroups.length; g++) {
            if (rawGroups[g].toLowerCase() === priorityOrder[p]) {
              prioritized.push(rawGroups[g]);
              break;
            }
          }
        }

        var remaining = [];
        for (var r = 0; r < rawGroups.length; r++) {
          if (priorityOrder.indexOf(rawGroups[r].toLowerCase()) === -1) {
            remaining.push(rawGroups[r]);
          }
        }

        var orderedTabs = prioritized.concat(["All"], remaining);

        if (orderedTabs.indexOf(activeCategory) === -1) {
          activeCategory = prioritized.length > 0 ? prioritized[0] : "All";
        }

        categoryTabs.innerHTML = "";
        for (var t = 0; t < orderedTabs.length; t++) {
          var groupName = orderedTabs[t];
          var tab = document.createElement("div");
          tab.className = "tab" + (groupName === activeCategory ? " active" : "");
          tab.setAttribute("tabindex", "0");
          tab.setAttribute("data-category", groupName);
          tab.textContent = groupName;
          categoryTabs.appendChild(tab);
        }
      }

      function getPlayableUrl(rawUrl, forceProxy) {
        var isHttpsSite = window.location.protocol === "https:";
        var isHttpStream = rawUrl.indexOf("http://") === 0;
        if ((isHttpsSite && isHttpStream && proxyToggle.checked) || forceProxy) {
          return "/api/proxy?url=" + encodeURIComponent(rawUrl);
        }
        return rawUrl;
      }

      function teardownPlayer() {
        clearInterval(stallWatchdogTimer);
        if (hls) {
          try { hls.destroy(); } catch (e) {}
          hls = null;
        }
        video.onloadedmetadata = null;
        video.onplaying = null;
        video.onerror = null;
        video.onstalled = null;
        try {
          video.pause();
          video.removeAttribute("src");
          video.load();
        } catch (e) {}
      }

      function safeVideoPlay() {
        try {
          var playPromise = video.play();
          if (playPromise && typeof playPromise.catch === "function") {
            playPromise.catch(function () {
              video.muted = true;
              try {
                var mutedPromise = video.play();
                if (mutedPromise && typeof mutedPromise.then === "function") {
                  mutedPromise.then(function () {
                    setStatus("Playing (Muted)", "warn");
                  }).catch(function () {
                    setStatus("Tap Video to Play", "warn");
                  });
                }
              } catch (e2) {
                setStatus("Tap Video to Play", "warn");
              }
            });
          }
        } catch (err) {
          setStatus("Tap Video to Play", "warn");
        }
      }

      /* Direct Hardware Media Pipeline (<video src=".m3u8">)
         Why YouTube plays 1080p60 effortlessly on your LG TV while JS Hls.js lagged:
         - JS Hls.js downloads segments in JavaScript, demuxes MPEG-TS to fMP4 on the single-core
           2019 LG webOS CPU, and copies buffers into MediaSource (causing frame drops & lag).
         - Passing the .m3u8 URL directly to <video src="..."> bypasses JavaScript completely
           and hands the stream directly to LG webOS's native C++ hardware media daemon (same chip
           pipeline YouTube uses!). */
      function startHardwarePlayback(streamUrl, channel, isProxyFallback) {
        teardownPlayer();
        updateQualityBadge("HW Direct • 60fps", false);
        setStatus(isProxyFallback ? "Connecting (HW Proxy)..." : "Connecting (HW)...", "warn");

        video.preload = "auto";
        video.src = streamUrl;

        var hardwareBooted = false;

        video.onloadedmetadata = function () {
          hardwareBooted = true;
          setStatus(isProxyFallback ? "Live (HW Proxy)" : "Live (TV Hardware)", "ok");
          safeVideoPlay();
        };

        video.onplaying = function () {
          hardwareBooted = true;
          setStatus(isProxyFallback ? "Live (HW Proxy)" : "Live (TV Hardware)", "ok");
        };

        video.onerror = function () {
          // If direct stream failed due to CORS or HTTP block, try proxied URL in hardware first
          if (!isProxyFallback && streamUrl.indexOf("/api/proxy") !== 0 && proxyToggle.checked) {
            startHardwarePlayback(getPlayableUrl(channel.url, true), channel, true);
            return;
          }
          // If stream uses a custom format (like .fmp4 or non-standard headers) that native HW rejects,
          // automatically fall back to Hls.js MSE!
          if (typeof Hls !== "undefined" && Hls.isSupported()) {
            startMseFallbackPlayback(getPlayableUrl(channel.url, false), channel, false);
          } else {
            setStatus("Stream Offline", "error");
          }
        };

        safeVideoPlay();

        // Watchdog: if hardware pipeline hasn't booted within 6 seconds (e.g. non-standard manifest),
        // seamlessly fall back to Hls.js MSE
        clearInterval(stallWatchdogTimer);
        stallCount = 0;
        lastPlaybackTime = 0;

        stallWatchdogTimer = setInterval(function () {
          if (!activeChannelObj || activeChannelUrl !== channel.url) return;

          if (!hardwareBooted) {
            stallCount++;
            if (stallCount >= 3 && typeof Hls !== "undefined" && Hls.isSupported()) {
              clearInterval(stallWatchdogTimer);
              startMseFallbackPlayback(getPlayableUrl(channel.url, false), channel, false);
            }
            return;
          }

          if (video.paused || video.ended) return;

          var nowTime = video.currentTime;
          if (Math.abs(nowTime - lastPlaybackTime) < 0.15) {
            stallCount++;
            if (video.buffered && video.buffered.length > 0) {
              var bufEnd = video.buffered.end(video.buffered.length - 1);
              if (bufEnd - nowTime > 0.4) {
                video.currentTime = bufEnd - 0.1;
              }
            }
          } else {
            stallCount = 0;
          }
          lastPlaybackTime = nowTime;
        }, 2000);
      }

      /* JS MSE Fallback (used on Desktop Chrome/Firefox or streams that require custom JS demuxing) */
      function startMseFallbackPlayback(streamUrl, channel, isRetry) {
        teardownPlayer();
        updateQualityBadge("MSE Auto", false);

        if (typeof Hls === "undefined" || !Hls.isSupported()) {
          setStatus("HLS Unsupported", "error");
          return;
        }

        hls = new Hls({
          enableWorker: false,
          startLevel: -1,
          autoStartLoad: true,
          capLevelToPlayerSize: true,
          maxBufferLength: 24,
          maxMaxBufferLength: 45,
          maxBufferHole: 0.8,
          liveSyncDurationCount: 4,
          liveMaxLatencyDurationCount: 12,
          fragLoadingTimeOut: 15000,
          fragLoadingMaxRetry: 6,
          manifestLoadingTimeOut: 10000,
          manifestLoadingMaxRetry: 4
        });

        hls.loadSource(streamUrl);
        hls.attachMedia(video);

        hls.on(Hls.Events.MANIFEST_PARSED, function () {
          setStatus(streamUrl.indexOf("/api/proxy") === 0 ? "Live (MSE Proxy)" : "Live (MSE)", "ok");
          safeVideoPlay();
        });

        hls.on(Hls.Events.LEVEL_SWITCHED, function (event, data) {
          if (!hls || !hls.levels || !hls.levels[data.level]) return;
          var h = hls.levels[data.level].height;
          if (h) {
            updateQualityBadge("MSE • " + h + "p", false);
          }
        });

        hls.on(Hls.Events.ERROR, function (event, data) {
          if (!data.fatal) return;

          if (data.type === Hls.ErrorTypes.MEDIA_ERROR) {
            hls.recoverMediaError();
            return;
          }

          if (data.type === Hls.ErrorTypes.NETWORK_ERROR) {
            if (!isRetry && streamUrl.indexOf("/api/proxy") !== 0 && proxyToggle.checked) {
              startMseFallbackPlayback(getPlayableUrl(channel.url, true), channel, true);
              return;
            }
            setStatus("Reconnecting...", "warn");
            setTimeout(function () {
              if (hls && activeChannelUrl === channel.url) {
                hls.startLoad();
              }
            }, 1500);
            return;
          }

          setStatus("Stream Offline / Geo-Blocked", "error");
        });
      }

      function startPlayback(streamUrl, channel) {
        if (preferHardwareEngine && supportsNativeHls) {
          startHardwarePlayback(streamUrl, channel, false);
        } else {
          startMseFallbackPlayback(streamUrl, channel, false);
        }
      }

      function updateActiveCardHighlight() {
        var cards = channelListEl.querySelectorAll(".channel-card");
        for (var i = 0; i < cards.length; i++) {
          var cardUrl = cards[i].getAttribute("data-url");
          if (cardUrl === activeChannelUrl) {
            addClass(cards[i], "active");
          } else {
            removeClass(cards[i], "active");
          }
        }
      }

      function playChannel(channel) {
        if (!channel) return;
        activeChannelUrl = channel.url;
        activeChannelObj = channel;

        try {
          localStorage.setItem(STORAGE_LAST_URL, channel.url);
        } catch (e) {}

        currentLogo.src = channel.logo;
        currentLogo.onerror = function () { currentLogo.src = FALLBACK_LOGO; };
        currentTitle.textContent = "#" + channel.num + "  " + channel.name;
        currentCategory.textContent = channel.group;

        updateActiveCardHighlight();

        if (window.location.protocol === "https:" && channel.url.indexOf("http://") === 0 && !proxyToggle.checked) {
          setStatus("Enable Auto-Proxy", "error");
          return;
        }

        var streamUrl = getPlayableUrl(channel.url, false);
        startPlayback(streamUrl, channel);
      }

      function stepChannel(delta) {
        var list = filteredChannels.length > 0 ? filteredChannels : channels;
        if (list.length === 0) return;

        var idx = -1;
        for (var i = 0; i < list.length; i++) {
          if (list[i].url === activeChannelUrl) {
            idx = i;
            break;
          }
        }
        var nextIdx = idx === -1 ? 0 : (idx + delta + list.length) % list.length;
        playChannel(list[nextIdx]);
      }

      function appendChannelBatch() {
        var existingBtn = document.getElementById("loadMoreChannelsBtn");
        if (existingBtn && existingBtn.parentNode) {
          existingBtn.parentNode.removeChild(existingBtn);
        }

        var end = Math.min(renderedCount + BATCH_SIZE, filteredChannels.length);
        var fragment = document.createDocumentFragment();

        for (var i = renderedCount; i < end; i++) {
          (function (ch, index) {
            var card = document.createElement("div");
            card.className = "channel-card" + (ch.url === activeChannelUrl ? " active" : "");
            card.setAttribute("tabindex", "0");
            card.setAttribute("data-index", index);
            card.setAttribute("data-url", ch.url);

            var img = document.createElement("img");
            img.src = ch.logo;
            img.alt = "";
            img.onerror = function () { this.src = FALLBACK_LOGO; };

            var infoDiv = document.createElement("div");
            infoDiv.className = "channel-info";

            var nameDiv = document.createElement("div");
            nameDiv.className = "channel-name";
            nameDiv.textContent = ch.num + ". " + ch.name;

            var groupDiv = document.createElement("div");
            groupDiv.className = "channel-group";
            groupDiv.textContent = ch.group;

            infoDiv.appendChild(nameDiv);
            infoDiv.appendChild(groupDiv);

            card.appendChild(img);
            card.appendChild(infoDiv);

            card.addEventListener("click", function () {
              if (video.muted) video.muted = false;
              playChannel(ch);
            });
            fragment.appendChild(card);
          })(filteredChannels[i], i);
        }

        renderedCount = end;
        channelListEl.appendChild(fragment);

        if (renderedCount < filteredChannels.length) {
          var moreBtn = document.createElement("button");
          moreBtn.id = "loadMoreChannelsBtn";
          moreBtn.className = "secondary load-more-btn";
          moreBtn.textContent = "Load More (" + (filteredChannels.length - renderedCount) + " remaining)";
          moreBtn.addEventListener("click", function () {
            appendChannelBatch();
          });
          channelListEl.appendChild(moreBtn);
        }
      }

      function renderChannels() {
        filteredChannels = [];
        var q = searchQuery.toLowerCase();
        for (var k = 0; k < channels.length; k++) {
          var chItem = channels[k];
          var matchesCat = activeCategory === "All" || chItem.group === activeCategory;
          var matchesSearch = chItem.name.toLowerCase().indexOf(q) !== -1;
          if (matchesCat && matchesSearch) {
            filteredChannels.push(chItem);
          }
        }

        channelCount.textContent = filteredChannels.length + " channels";
        channelListEl.innerHTML = "";
        channelListEl.scrollTop = 0;
        renderedCount = 0;

        appendChannelBatch();
      }

      channelListEl.addEventListener("scroll", function () {
        if (renderedCount >= filteredChannels.length) return;
        if (channelListEl.scrollTop + channelListEl.clientHeight >= channelListEl.scrollHeight - 160) {
          appendChannelBatch();
        }
      });

      /* LG Magic Remote & Keyboard Navigation */
      document.addEventListener("keydown", function (e) {
        var key = e.keyCode || e.which;
        var activeEl = document.activeElement;
        var isTyping = activeEl && (activeEl.tagName === "INPUT");

        if (video.muted) {
          video.muted = false;
        }

        if (!isTyping && key >= 48 && key <= 57) {
          var digit = String(key - 48);
          zapDigits += digit;
          setStatus("CH " + zapDigits + "...", "warn");

          clearTimeout(zapTimer);
          zapTimer = setTimeout(function () {
            var targetNum = parseInt(zapDigits, 10);
            zapDigits = "";
            for (var i = 0; i < channels.length; i++) {
              if (channels[i].num === targetNum) {
                playChannel(channels[i]);
                break;
              }
            }
          }, 1100);
          return;
        }

        if (key === 427 || key === 33) {
          e.preventDefault();
          stepChannel(-1);
          return;
        }
        if (key === 428 || key === 34) {
          e.preventDefault();
          stepChannel(1);
          return;
        }

        if (key === 461 || key === 27) {
          if (hasClass(settingsDrawer, "open")) {
            e.preventDefault();
            removeClass(settingsDrawer, "open");
            removeClass(settingsToggleBtn, "active");
          }
          return;
        }

        if (activeEl && hasClass(activeEl, "channel-card")) {
          var idx = parseInt(activeEl.getAttribute("data-index"), 10);
          var cards = channelListEl.querySelectorAll(".channel-card");

          if (key === 13) {
            e.preventDefault();
            activeEl.click();
          } else if (key === 39) {
            e.preventDefault();
            if (idx + 1 >= renderedCount && renderedCount < filteredChannels.length) {
              appendChannelBatch();
              cards = channelListEl.querySelectorAll(".channel-card");
            }
            if (cards[idx + 1]) cards[idx + 1].focus();
          } else if (key === 37) {
            e.preventDefault();
            if (cards[idx - 1]) cards[idx - 1].focus();
          } else if (key === 40) {
            e.preventDefault();
            if (idx + 2 >= renderedCount && renderedCount < filteredChannels.length) {
              appendChannelBatch();
              cards = channelListEl.querySelectorAll(".channel-card");
            }
            if (cards[idx + 2]) cards[idx + 2].focus();
          } else if (key === 38) {
            e.preventDefault();
            if (idx - 2 >= 0 && cards[idx - 2]) {
              cards[idx - 2].focus();
            } else {
              var activeTab = categoryTabs.querySelector(".tab.active") || categoryTabs.querySelector(".tab");
              if (activeTab) activeTab.focus();
            }
          }
          return;
        }

        if (activeEl && hasClass(activeEl, "tab")) {
          var tabs = Array.prototype.slice.call(categoryTabs.querySelectorAll(".tab"));
          var tIdx = tabs.indexOf(activeEl);
          if (key === 39 && tabs[tIdx + 1]) {
            e.preventDefault();
            tabs[tIdx + 1].focus();
          } else if (key === 37 && tabs[tIdx - 1]) {
            e.preventDefault();
            tabs[tIdx - 1].focus();
          } else if (key === 40) {
            e.preventDefault();
            var firstCard = channelListEl.querySelector(".channel-card.active") || channelListEl.querySelector(".channel-card");
            if (firstCard) firstCard.focus();
          } else if (key === 13) {
            e.preventDefault();
            activeEl.click();
          }
        }
      });

      categoryTabs.addEventListener("click", function (e) {
        if (!hasClass(e.target, "tab")) return;
        var allTabs = categoryTabs.querySelectorAll(".tab");
        for (var i = 0; i < allTabs.length; i++) removeClass(allTabs[i], "active");
        addClass(e.target, "active");
        activeCategory = e.target.getAttribute("data-category");
        renderChannels();
      });

      searchInput.addEventListener("input", function (e) {
        searchQuery = e.target.value;
        renderChannels();
      });

      prevChBtn.addEventListener("click", function () {
        if (video.muted) video.muted = false;
        stepChannel(-1);
      });

      nextChBtn.addEventListener("click", function () {
        if (video.muted) video.muted = false;
        stepChannel(1);
      });

      loadUrlBtn.addEventListener("click", function () {
        var url = m3uUrlInput.value.replace(/^\s+|\s+$/g, "");
        if (url) {
          try { localStorage.setItem(STORAGE_CUSTOM_M3U, url); } catch (e) {}
          loadM3UPlaylist(url);
          removeClass(settingsDrawer, "open");
          removeClass(settingsToggleBtn, "active");
        }
      });

      resetDefaultBtn.addEventListener("click", function () {
        try { localStorage.removeItem(STORAGE_CUSTOM_M3U); } catch (e) {}
        m3uUrlInput.value = "";
        loadM3UPlaylist(DEFAULT_M3U_URL);
        removeClass(settingsDrawer, "open");
        removeClass(settingsToggleBtn, "active");
      });

      fileInput.addEventListener("change", function (e) {
        var file = e.target.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function (ev) {
          var parsed = parseM3U(ev.target.result);
          if (parsed.length > 0) {
            channels = parsed;
            activeCategory = "Bangladesh";
            buildCategoryTabs();
            renderChannels();
            removeClass(settingsDrawer, "open");
            removeClass(settingsToggleBtn, "active");
            playChannel(filteredChannels[0] || channels[0]);
          }
        };
        reader.readAsText(file);
      });

      function initializeStartupPlayback() {
        var savedUrl = null;
        try { savedUrl = localStorage.getItem(STORAGE_LAST_URL); } catch (e) {}

        var startChannel = null;
        if (savedUrl) {
          for (var i = 0; i < channels.length; i++) {
            if (channels[i].url === savedUrl) {
              startChannel = channels[i];
              break;
            }
          }
        }
        if (!startChannel) {
          startChannel = filteredChannels.length > 0 ? filteredChannels[0] : channels[0];
        }
        if (startChannel) {
          playChannel(startChannel);
        }
      }

      function loadBuiltinFallback() {
        channels = [];
        for (var idx = 0; idx < BUILTIN_CHANNELS.length; idx++) {
          var c = BUILTIN_CHANNELS[idx];
          channels.push({ num: idx + 1, name: c.name, group: c.group, logo: c.logo, url: c.url });
        }
        activeCategory = "Bangladesh";
        buildCategoryTabs();
        renderChannels();
        initializeStartupPlayback();
      }

      function loadM3UPlaylist(url) {
        setStatus("Loading Channels...", "warn");
        var xhr = new XMLHttpRequest();
        xhr.open("GET", url, true);
        xhr.timeout = 8000;

        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            if (xhr.status >= 200 && xhr.status < 300 && xhr.responseText) {
              var parsed = parseM3U(xhr.responseText);
              if (parsed.length > 0) {
                channels = parsed;
                activeCategory = "Bangladesh";
                buildCategoryTabs();
                renderChannels();
                initializeStartupPlayback();
                return;
              }
            }
            loadBuiltinFallback();
          }
        };

        xhr.onerror = function () {
          loadBuiltinFallback();
        };

        xhr.ontimeout = function () {
          loadBuiltinFallback();
        };

        try {
          xhr.send();
        } catch (err) {
          loadBuiltinFallback();
        }
      }

      var initialM3U = DEFAULT_M3U_URL;
      try {
        var savedM3U = localStorage.getItem(STORAGE_CUSTOM_M3U);
        if (savedM3U) {
          initialM3U = savedM3U;
          m3uUrlInput.value = savedM3U;
        }
      } catch (e) {}

      loadM3UPlaylist(initialM3U);
    })();
  </script>
</body>
</html>
